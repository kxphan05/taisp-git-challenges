name: Check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the checker reads your full git history
      - name: Check your work (flag appears in the run summary)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/checker/check.py
